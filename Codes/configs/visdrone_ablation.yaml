# Path A — runs BoxMOT's official `visdrone-ablation` benchmark.
# Uses the ablation YOLOX detector + LightMBN ReID. Produces metrics
# directly comparable to BoxMOT's published VisDrone numbers.

detector: yolox_x_visdrone
reid: lmbn_n_duke
device: cuda:0
half: false

benchmark: visdrone-ablation

trackers:
  - botsort
  - boosttrack
  - deepocsort
  - bytetrack
  - ocsort

val:
  postprocessing: gbrc
  verbose: true
  project: outputs/visdrone/ablation
  name: bench
  exist_ok: true
